<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171A18"/>
      <stop offset="0.6" stop-color="#101211"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.78" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#C9B485" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#C9B485" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9B485" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9B485" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8DDBE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C9B485" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#beam)"/>
  <!-- ลำแสงโปรเจกเตอร์ -->
  <g opacity="0.5">
    <polygon points="1240,20 1330,20 900,760 760,760" fill="#C9B485" opacity="0.05"/>
    <polygon points="1300,20 1390,20 1060,760 920,760" fill="#C9B485" opacity="0.04"/>
  </g>
  <!-- ดวงดาวเม็ดฝนแสง -->
  <g fill="#EAE2CF">
    <circle cx="180" cy="120" r="1.6" opacity="0.5"/>
    <circle cx="420" cy="80" r="1.2" opacity="0.4"/>
    <circle cx="640" cy="170" r="1.8" opacity="0.35"/>
    <circle cx="910" cy="60" r="1.4" opacity="0.5"/>
    <circle cx="1180" cy="150" r="1.2" opacity="0.4"/>
    <circle cx="1460" cy="90" r="1.7" opacity="0.45"/>
    <circle cx="300" cy="260" r="1.1" opacity="0.3"/>
    <circle cx="760" cy="90" r="1.3" opacity="0.35"/>
    <circle cx="1340" cy="300" r="1.2" opacity="0.3"/>
  </g>
  <!-- แถวที่นั่งด้านล่าง (silhouette) -->
  <g fill="#080A09">
    <path d="M0,760 Q400,705 800,705 Q1200,705 1600,760 L1600,900 L0,900 Z"/>
    <path d="M0,830 Q400,795 800,795 Q1200,795 1600,830 L1600,900 L0,900 Z" opacity="0.9"/>
  </g>
  <!-- หัวโรงเป็นแสงทองบาง ๆ -->
  <rect x="0" y="700" width="1600" height="2" fill="url(#glow)" opacity="0.5"/>
  <!-- ตัวอักษรสัญลักษณ์ -->
  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="14" fill="#C9B485" opacity="0.85">MAISON</text>
  <text x="82" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="7" fill="#A3A89F" opacity="0.8">THE ART OF CINEMA</text>
</svg>
