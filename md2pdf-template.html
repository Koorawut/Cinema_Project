<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 16mm 14mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
    font-size: 11.5pt; line-height: 1.65; color: #1f2621; margin: 0; padding: 24px 30px;
  }
  h1 { font-size: 19pt; color: #171a18; border-bottom: 3px solid #C9B485; padding-bottom: 8px; margin: 0 0 14px; }
  h2 { font-size: 14.5pt; color: #23201A; background: #f3efe7; border-left: 5px solid #C9B485; padding: 6px 12px; margin: 26px 0 10px; page-break-after: avoid; }
  h3 { font-size: 12pt; color: #55503E; margin: 18px 0 8px; page-break-after: avoid; }
  p { margin: 7px 0; }
  ul, ol { margin: 6px 0 6px 22px; padding: 0; }
  li { margin: 3px 0; }
  blockquote {
    margin: 10px 0; padding: 8px 14px; background: #f7f4ee; border-left: 4px solid #A34A32;
    color: #4a4438; font-size: 10.5pt;
  }
  blockquote p { margin: 3px 0; }
  code {
    font-family: Consolas, "Cascadia Mono", monospace; font-size: 9.8pt;
    background: #efece5; padding: 1px 5px; border-radius: 3px; color: #33302a;
  }
  table { border-collapse: collapse; width: 100%; margin: 10px 0 14px; font-size: 10.3pt; page-break-inside: avoid; }
  th { background: #2e3230; color: #f7f1e8; padding: 6px 9px; text-align: left; font-weight: 600; }
  td { border: 1px solid #d8d2c6; padding: 6px 9px; vertical-align: top; }
  tr:nth-child(even) td { background: #faf8f4; }
  hr { border: none; border-top: 1.5px solid #d8d2c6; margin: 20px 0; }
  strong { color: #171a18; }
  .pagebreak { page-break-before: always; }
</style>
</head>
<body>{{{content}}}</body>
</html>
