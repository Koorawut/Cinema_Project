<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAISON — ชุดทดสอบอัตโนมัติ (API logic)</title>
  <style>
    body { font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; background: #F2EFE7; color: #171A18; margin: 0; padding: 32px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .note { font-size: 13px; color: #696D66; margin: 0 0 16px; max-width: 720px; line-height: 1.6; }
    pre { background: #101211; color: #E8E6DC; padding: 20px; border-radius: 8px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; min-height: 120px; }
  </style>
</head>
<body>
  <h1>MAISON — ชุดทดสอบอัตโนมัติ (API logic)</h1>
  <p class="note">ทดสอบตามระเบียบใน cinema-testing-formation.md (ชั้น T1) — หน้านี้สำรองข้อมูล localStorage/sessionStorage ของคุณไว้ก่อน แล้วคืนค่าอัตโนมัติเมื่อจบ จึงไม่กระทบข้อมูลจริง ใช้เวลาประมาณ 20 วินาทีเพราะจำลอง latency ของ API ตามจริง</p>
  <pre id="test-out">กำลังเริ่ม...</pre>

  <script>
    /* สำรองและล้างข้อมูลจริงก่อนโหลด api.js เพื่อให้ทุกรอบทดสอบกับ seed สดเสมอ
       (run-tests.js จะคืนค่าจาก window.__MAISON_TEST_BACKUP เมื่อจบ) */
    window.__MAISON_TEST_BACKUP = {};
    ['maison_v1_db', 'maison_v1_session', 'maison_v1_session_fb', 'maison_v1_remember'].forEach(function (k) {
      try {
        window.__MAISON_TEST_BACKUP[k] = {
          ls: localStorage.getItem(k),
          ss: sessionStorage.getItem(k)
        };
        localStorage.removeItem(k);
        sessionStorage.removeItem(k);
      } catch (e) {}
    });
    document.getElementById('test-out').textContent = '';
  </script>
  <script src="../assets/js/api.js"></script>
  <script src="run-tests.js"></script>
</body>
</html>
